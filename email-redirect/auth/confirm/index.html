<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening PetPulse…</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        text-align: center;
        background: #f5f5f5;
      }
      .message {
        color: #333;
        margin-bottom: 16px;
      }
      .error {
        color: #b00020;
      }
    </style>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var tokenHash = params.get("token_hash");
        var type = params.get("type") || "signup";
        if (tokenHash) {
          var appUrl =
            "petpulse://auth/callback?token_hash=" +
            encodeURIComponent(tokenHash) +
            "&type=" +
            encodeURIComponent(type);
          window.location.href = appUrl;
        } else {
          document.body.innerHTML =
            '<p class="message error">Invalid or missing link.</p>' +
            '<p class="message">Please use the link from your PetPulse confirmation email.</p>';
        }
      })();
    </script>
  </head>
  <body>
    <p class="message">PetPulse account confirmed. Return to PetPulse app...</p>
  </body>
</html>
